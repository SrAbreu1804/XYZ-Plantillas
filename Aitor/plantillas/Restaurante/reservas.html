<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casa Iván – Reservas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--color-light);">

<nav id="main-nav">
  <a href="index.html" class="nav-brand">Casa <span>Iván</span></a>
  <button class="nav-toggler" id="nav-toggler"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="carta.html">Carta</a></li>
    <li><a href="galeria.html">Galería</a></li>
    <li><a href="nosotros.html">Nosotros</a></li>
    <li><a href="contacto.html">Contacto</a></li>
    <li class="active"><a href="reservas.html" class="btn-reserva">Reservar Mesa</a></li>
  </ul>
</nav>

<section style="padding: 5rem 1rem; min-height: 85vh; display: flex; align-items: center;">
  <div class="modal-box" style="box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 3px solid var(--color-amber);">
    <h2 style="text-align: center;">Reservar Mesa</h2>
    <p class="subtitle" style="text-align: center;">Rellena el formulario y te confirmaremos la reserva en menos de 2 horas.</p>

    <div id="reserva-form">
      <div class="form-row">
        <div class="form-group"><label for="r-nombre">Nombre *</label><input type="text" id="r-nombre" placeholder="Tu nombre" required></div>
        <div class="form-group"><label for="r-tel">Teléfono *</label><input type="tel" id="r-tel" placeholder="+34 600 000 000" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="r-fecha">Fecha *</label><input type="date" id="r-fecha" required></div>
        <div class="form-group">
          <label for="r-hora">Hora *</label>
          <select id="r-hora">
            <option value="">Selecciona</option>
            <option>13:00</option><option>13:30</option>
            <option>14:00</option><option>14:30</option>
            <option>20:00</option><option>20:30</option>
            <option>21:00</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="r-pax">Comensales *</label>
          <select id="r-pax"><option>1 persona</option><option>2 personas</option><option>4 personas</option><option>+6 personas</option></select>
        </div>
        <div class="form-group"><label for="r-email">Email</label><input type="email" id="r-email" placeholder="tu@email.com"></div>
      </div>
      <div class="form-group">
        <label for="r-notas">Notas especiales</label>
        <textarea id="r-notas" rows="2" placeholder="Alergias, ocasión especial..."></textarea>
      </div>
      <button class="btn-submit" id="submit-reserva">Confirmar Reserva</button>
    </div>

    <div id="reserva-success" style="display:none;text-align:center;padding:2rem 0;">
      <i class="bi bi-check-circle" style="font-size:3rem;color:var(--color-amber);display:block;margin-bottom:1rem;"></i>
      <h3 style="font-family:var(--font-display);margin-bottom:0.5rem;">¡Reserva recibida!</h3>
      <p style="color:var(--color-gray);font-size:0.9rem;">Te confirmaremos en breve. ¡Hasta pronto en Casa Iván!</p>
      <a href="index.html" class="btn-submit" style="display:inline-block; text-decoration:none; margin-top: 1rem; width: auto; padding: 0.5rem 1.5rem;">Volver al Inicio</a>
    </div>
  </div>
</section>

<footer><p>© 2026 Casa Iván.</p></footer>
<script src="script.js"></script>
</body>
</html>
