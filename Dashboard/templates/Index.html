<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online | Inicio</title>
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="hero">
            <div class="hero__content">
                <h2 class="hero__title">Descubre lo Nuevo</h2>
                <p class="hero__subtitle">Calidad y confianza en cada compra.</p>
                <a href="#productos" class="btn-primary">Ver Catálogo</a>
            </div>
        </section>

        <section id="productos" class="featured">
            <div class="container">
                <h2 class="section-title">Productos Destacados</h2>
                
                <div class="featured__slider-container">
                    <div class="featured__wrapper">
                        
                        <article class="product-card">
                            <div class="product-card__badge">Oferta</div>
                            <img src="https://via.placeholder.com/250" alt="Producto 1" class="product-card__img">
                            <div class="product-card__info">
                                <h3 class="product-card__title">Producto Estrella</h3>
                                <p class="product-card__price">29.99€</p>
                                <button class="btn-add-cart">Añadir al carrito</button>
                            </div>
                        </article>

                        <article class="product-card">
                            <img src="https://via.placeholder.com/250" alt="Producto 2" class="product-card__img">
                            <div class="product-card__info">
                                <h3 class="product-card__title">Lo más vendido</h3>
                                <p class="product-card__price">45.00€</p>
                                <button class="btn-add-cart">Añadir al carrito</button>
                            </div>
                        </article>

                        <article class="product-card">
                            <img src="https://via.placeholder.com/250" alt="Producto 3" class="product-card__img">
                            <div class="product-card__info">
                                <h3 class="product-card__title">Novedad 2026</h3>
                                <p class="product-card__price">15.50€</p>
                                <button class="btn-add-cart">Añadir al carrito</button>
                            </div>
                        </article>

                        </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Mi Tienda Online - Todos los derechos reservados.</p>
    </footer>
<script src="JS/header.js"></script>
</body>
</html>
