<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explorador de Plantillas - Giovanni</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="mb-4">
        <h1 class="text-center">Explorador de Proyectos</h1>
        <div class="d-flex justify-content-between align-items-center mt-4">
            <!-- Buscador -->
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar proyecto..." onkeyup="filterFiles()">
            </div>
        </div>
    </header>

    <!-- Grid donde se cargarán las carpetas y archivos -->
    <div class="row g-3" id="explorerGrid">
        <!-- Se genera con JS -->
    </div>
</div>


<script src="js/dashboard.js"></script>
</body>
</html>
