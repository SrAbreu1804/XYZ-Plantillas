<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Plantillas - Giovanni</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="container py-5">
    <header class="mb-5">
        <h1 id="mainTitle" class="text-center fw-bold display-5 mb-4">Explorador de Proyectos</h1>
        
        <div id="topControlBar" class="row g-3 align-items-center justify-content-between p-3 rounded shadow-sm">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Buscar proyecto...">
                </div>
            </div>
            
            <div class="col-12 col-md-auto text-end">
                <button type="button" id="themeToggleBtn" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" onclick="toggleDarkMode()">
                    <i class="bi bi-moon-stars-fill"></i>
                    <span>Cambiar Modo</span>
                </button>
            </div>
        </div>
    </header>

    <main class="row g-4" id="explorerGrid"></main>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
