<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
                            
<header class="header-main">
    <nav class="navbar navbar-expand-lg navbar-colegio">
        <div class="container">
            <a class="navbar-brand logo-colegio" href="index.html">Colegio</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="clases.html">Clases</a></li>
                    <li class="nav-item"><a class="nav-link  active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    
<main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm p-4">
                        <h2 class="text-center fw-bold mb-4">Solicitud de Admisión</h2>
                        <p class="text-center text-secondary mb-5">Completa el formulario y nos pondremos en contacto para agendar una visita.</p>
                        
                        <form action="https://formsubmit.co/tuemail" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre del Tutor</label>
                                <input type="text" name="name" class="form-control" placeholder="Escribe tu nombre completo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nivel de Interés</label>
                                <select name="nivel" class="form-select">
                                    <option value="infantil">Infantil</option>
                                    <option value="primaria">Primaria</option>
                                    <option value="secundaria">Secundaria</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mensaje o Consulta</label>
                                <textarea name="message" class="form-control" rows="4" placeholder="Cuéntanos tus dudas..."></textarea>
                            </div>

                            <input type="hidden" name="_captcha" value="false">

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ENVIAR SOLICITUD</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
    <div class="container text-center">
        <p>&copy; 2026 Colegio - Plantilla creada por ROBOOTICS EDUCATION SOLUTIONS S.L. </p>
        <div class="iconos-sociales">
            <a href="https://www.instagram.com/robootics/"><i class="bi bi-instagram"></i></a>
            <a href="https://www.facebook.com/robootics/"><i class="bi bi-facebook"></i></a>
        </div>
    </div>
    </footer>
    <script
    src="js/scripts.js">
    </script>
</body>
</html>
