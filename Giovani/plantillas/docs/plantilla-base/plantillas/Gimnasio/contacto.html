<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Gimnasio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">POWER<span>GYM</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">INICIO</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">NOSOTROS</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">CLASES</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">CONTACTO</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main class="seccion-pagina">
        <div class="container">
            <div class="row">
                <div class="col-md-7">
                    <div class="formulario-box">
                        <h2 class="formulario-box__title">Solicita tu Cita</h2>
                        <form action="https://formsubmit.co/tuemail" method="POST" class="form-gimnasio">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" name="name" class="form-control input-gimnasio" placeholder="Tu nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control input-gimnasio" placeholder="ejemplo@correo.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Teléfono de Contacto</label>
                                <input type="tel" name="telefono" pattern="[0-9]{9,15}" class="form-control input-gimnasio" placeholder="600000000" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Servicio de interés</label>
                                <select name="servicio" class="form-select input-gimnasio">
                                    <option value="general">Consulta General</option>
                                    <option value="clases">Clases Grupales</option>
                                    <option value="personal">Entrenamiento Personal</option>
                                    <option value="membresia">Membresía</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Enviar Solicitud</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="info-contacto-box">
                        <h3 class="info-contacto-box__title">Datos de Contacto</h3>
                        <p class="info-contacto-box__item"><i class="bi bi-geo-alt"></i> Calle Ejemplo 123, Ciudad, País</p>
                        <p class="info-contacto-box__item"><i class="bi bi-telephone"></i> +34 123 456 789</p>
                        <p class="info-contacto-box__item"><i class="bi bi-envelope"></i> info@powergym.com</p>
                        <div class="mapa-wrapper">
                            <iframe 
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1041.029145504523!2d-17.7680357319246!3d28.64202659391533!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc6bedb18f227f8d%3A0x26f4cbeb5ff76e5d!2sXYZ%20Digital!5e0!3m2!1ses!2ses!4v1778663110578!5m2!1ses!2ses" 
                                width="100%" 
                                height="300" 
                                style="border:0;" 
                                allowfullscreen="" 
                                loading="lazy">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Gimnasio - Plantilla creada por ROBOOTICS EDUCATION SOLUTIONS S.L.</p>
            <div class="iconos-sociales">
                <a href="https://www.instagram.com/robootics/"><i class="bi bi-instagram"></i></a>
                <a href="https://www.facebook.com/robootics/"><i class="bi bi-facebook"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
