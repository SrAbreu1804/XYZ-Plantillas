    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
                            
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">ETERNO<span>EVENTOS</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">INICIO</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">NOSOTROS</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">SERVICIOS</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">CONTACTO</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main class="seccion-pagina bg-light py-5">
        <div class="container" style="max-width: 600px;">
            <h2 class="text-center mb-5 fw-bold display-6">CUÉNTANOS TU IDEA</h2>

            <form action="https://formsubmit.co/tuemail" method="POST" class="p-4 bg-white rounded shadow-sm border">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold small text-uppercase">Nombre Completo</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Tu nombre..." required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small text-uppercase">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="tipoCoaching" class="form-label fw-bold small text-uppercase">¿Qué servicio necesitas?</label>
                    <select id="tipoCoaching" name="tipoCoaching" class="form-select">
                        <option selected disabled value="">Selecciona una opción...</option>
                        <option value="integral">Organización Integral / Wedding Planner</option>
                        <option value="catering">Alta Gastronomía y Catering</option>
                        <option value="fotografia">Reportaje Fotográfico y Vídeo</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="message" class="form-label fw-bold small text-uppercase">Detalles del Evento</label>
                    <textarea id="message" name="message" class="form-control" rows="4" placeholder="Cuéntanos la fecha estimada, el tipo de evento y lo que has imaginado..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 text-uppercase fw-bold">Enviar Solicitud</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Eventos - Plantilla creada por ROBOOTICS EDUCATION SOLUTIONS S.L. </p>
            <div class="iconos-sociales">
                <a href="https://www.instagram.com/robootics/"><i class="bi bi-instagram"></i></a>
                <a href="https://www.facebook.com/robootics/"><i class="bi bi-facebook"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>

</body>
</html>
