<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
                            
<header class="header-main">
    <nav class="navbar navbar-expand-lg navbar-clinica">
        <div class="container">
            <a class="navbar-brand logo-clinica" href="index.html">Fisio<span>Life</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>

                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    
    <main class="seccion-pagina">
        <div class="container">
        <div class="row">
            <div class="col-md-7">
                <div class="formulario-box">
                    <h2 class="formulario-box__title">Solicita tu Cita</h2>
                    <form action="https://formsubmit.co/tuemail" method="POST" class="form-clinica">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control input-clinica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono de Contacto</label>
                            <input type="tel" name="telefono" pattern="[0-9]{9,15}" class="form-control input-clinica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidad</label>
                            <select name="especialidad" class="form-select input-clinica">
                                <option value="fisioterapia">Fisioterapia General</option>
                                <option value="osteopatia">Osteopatía</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-enviar">Enviar Solicitud</button>
                    </form>
                </div>
            </div>
            <div class="col-md-5">
                <div class="info-contacto-box">
                    <h3 class="info-contacto-box__title">Datos de Contacto</h3>
                    <p class="info-contacto-box__item"><i class="bi bi-geo-alt"></i> Carretera San Antonio, nº259. Breña Baja, Santa Cruz de Tenerife</p>
                    <div class="mapa-wrapper">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1041.029145504523!2d-17.7680357319246!3d28.64202659391533!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc6bedb18f227f8d%3A0x26f4cbeb5ff76e5d!2sXYZ%20Digital!5e0!3m2!1ses!2ses!4v1778663110578!5m2!1ses!2ses" 
                            width="100%" 
                            height="300" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>
