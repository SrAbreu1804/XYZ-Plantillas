<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
                            
<header class="header-main">
    <nav class="navbar navbar-expand-lg navbar-clinica">
        <div class="container">
            <a class="navbar-brand logo-clinica" href="index.html">Fisio<span>Life</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    
    <main class="seccion-pagina">
        <div class="container">
        <div class="row">
            <div class="col-md-7">
                <div class="formulario-box">
                    <h2 class="formulario-box__title">Solicita tu Cita</h2>
                    <form action="https://formsubmit.co/tuemail@gmail.com" method="POST" class="form-clinica">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control input-clinica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono de Contacto</label>
                            <input type="tel" name="telefono" class="form-control input-clinica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidad</label>
                            <select name="especialidad" class="form-select input-clinica">
                                <option value="fisioterapia">Fisioterapia General</option>
                                <option value="osteopatia">Osteopatía</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-enviar">Enviar Solicitud</button>
                    </form>
                </div>
            </div>
            <div class="col-md-5">
                <div class="info-contacto-box">
                    <h3 class="info-contacto-box__title">Datos de Contacto</h3>
                    <p class="info-contacto-box__item"><i class="bi bi-geo-alt"></i> Calle Salud, 12. Local B.</p>
                    <div class="mapa-wrapper">
                        </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    <footer>
        <div class="container text-center">
            <p>&copy; 2026 Fisio - Plantilla creada por ROBOOTICS EDUCATION SOLUTIONS S.L. </p>

            <a href="https://www.facebook.com/robootics/"><i class="bi bi-facebook"></i></a>
            </div>
            </div>
        </div>
    </footer>

    <script
    src="js/scripts.js">
    </script>
</body>
</html>
